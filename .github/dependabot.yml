version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli-go
    schedule:
      interval: daily
    groups:
      go-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # fumadocs-core must match the fumadocs-ui alias (npm:@fumadocs/base-ui@x)
      # exactly, and Dependabot cannot update alias specs: bump both by hand.
      - dependency-name: fumadocs-core
