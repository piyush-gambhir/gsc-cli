version: 2
project_name: gsc-cli
builds:
  - binary: gsc
    dir: cli-go
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/piyush-gambhir/gsc-cli/cli-go/internal/build.Version={{.Version}}
      - -X github.com/piyush-gambhir/gsc-cli/cli-go/internal/build.Commit={{.Commit}}
      - -X github.com/piyush-gambhir/gsc-cli/cli-go/internal/build.Date={{.Date}}
      # Built-in OAuth client from repository secrets; empty in snapshot builds.
      - -X github.com/piyush-gambhir/gsc-cli/cli-go/internal/auth.BuiltinClientID={{ index .Env "GSC_OAUTH_CLIENT_ID" }}
      - -X github.com/piyush-gambhir/gsc-cli/cli-go/internal/auth.BuiltinClientSecret={{ index .Env "GSC_OAUTH_CLIENT_SECRET" }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
sboms:
  - artifacts: archive
checksum:
  name_template: checksums.txt
release:
  # The release workflow publishes the draft after attesting the artifacts, so
  # the release is complete when it becomes visible (and immutable).
  draft: true
  replace_existing_draft: true
changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^ci:', '^chore:']
